<!DOCTYPE html>
<html>
  <head>
    <title>Code Quality Predictor</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f2f4f8;
      }
      .card {
        margin-top: 40px;
      }
      textarea {
        font-family: consolas;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="card shadow p-4">
        <h2 class="text-center mb-3">🧠 Code Quality Predictor</h2>

        <form method="POST">
          <textarea
            name="code"
            class="form-control"
            rows="10"
            placeholder="Paste your code here..."
          ></textarea>

          <br />

          <button class="btn btn-primary w-100">Predict Quality</button>
        </form>

        {% if error %}

        <div class="alert alert-danger mt-3">
          <h5>⚠ Error</h5>
          <p>{{ error }}</p>
        </div>

        {% elif result %}

        <div
          class="alert mt-3 {% if result=='Good' %}alert-success {% elif result=='Average' %}alert-warning {% else %}alert-danger{% endif %}"
        >
          <h4>Quality: {{ result }}</h4>
        </div>

        {% endif %}
      </div>
    </div>
  </body>
</html>
